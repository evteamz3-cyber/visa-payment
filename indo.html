<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הזנת קוד קופון</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }
        
        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        
        .success-message {
            color: #27ae60;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        
        .discount-badge {
            background: #27ae60;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎟️</div>
        <h1>יש לך קוד קופון?</h1>
        <p class="subtitle">הזן את הקוד שלך כדי לקבל הנחה מיוחדת</p>
        
        <div class="input-group">
            <input 
                type="text" 
                id="couponCode" 
                placeholder="הזן קוד קופון"
                maxlength="20"
            >
            <div class="error-message" id="errorMessage">קוד קופון שגוי</div>
            <div class="success-message" id="successMessage">
                קוד קופון תקין! ✓
                <div class="discount-badge">הנחה של 10 ש"ח</div>
            </div>
        </div>
        
        <div class="button-group">
            <button class="btn-primary" onclick="validateAndRedirect()">
                אמת קוד והמשך לתשלום
            </button>
            <button class="btn-secondary" onclick="redirectWithoutDiscount()">
                המשך ללא קוד קופון
            </button>
        </div>
    </div>

    <script>
        const VALID_COUPONS = ['mizrahnik10', 'MIZRAHNIK10', 'Mizrahnik10'];
        const DISCOUNT_URL = 'https://pay.sumit.co.il/a3x3bj/ukki2v/';
        const REGULAR_URL = 'https://pay.sumit.co.il/a3x3bj/uklf7e/';
        
        const couponInput = document.getElementById('couponCode');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        
        // Allow Enter key to submit
        couponInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                validateAndRedirect();
            }
        });
        
        // Clear messages when typing
        couponInput.addEventListener('input', function() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        });
        
        function validateAndRedirect() {
            const code = couponInput.value.trim();
            
            if (!code) {
                showError('אנא הזן קוד קופון');
                return;
            }
            
            if (VALID_COUPONS.includes(code)) {
                showSuccess();
                setTimeout(() => {
                    window.location.href = DISCOUNT_URL;
                }, 1000);
            } else {
                showError('קוד קופון שגוי. נסה שוב או המשך ללא קוד.');
            }
        }
        
        function redirectWithoutDiscount() {
            window.location.href = REGULAR_URL;
        }
        
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
            couponInput.style.borderColor = '#e74c3c';
        }
        
        function showSuccess() {
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
            couponInput.style.borderColor = '#27ae60';
        }
    </script>
</body>
</html>
